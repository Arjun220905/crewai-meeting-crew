name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.3"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Test, lint, type-check, and replay
        run: make test
