[project]
name = "crewai-meeting-crew"
version = "0.1.0"
description = "A MeetStream Labs example for post-meeting recaps and follow-up drafts"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai==1.15.28",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<3", "pytest>=8,<10", "pytest-socket>=0.7,<1", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = ["live: opt-in Gemini smoke test"]

[tool.ruff]
extend-exclude = [".run"]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["meeting_crew", "scripts"]
